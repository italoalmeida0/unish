name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            goos: windows
            goarch: amd64
            out: unish-windows-amd64.exe
            smoke: true
          - os: windows-latest
            goos: windows
            goarch: arm64
            out: unish-windows-arm64.exe
            smoke: false # windows-latest is x86_64; can't exec ARM64
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            out: unish-linux-amd64
            smoke: true
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            out: unish-linux-arm64
            smoke: true
          - os: macos-latest
            goos: darwin
            goarch: amd64
            out: unish-macos-amd64
            smoke: true # Rosetta runs amd64 on ARM runners
          - os: macos-14
            goos: darwin
            goarch: arm64
            out: unish-macos-arm64
            smoke: true
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache: true
      - name: vet
        run: go vet ./...
      - name: build
        run: go build -trimpath -ldflags="-s -w -X main.version=${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}" -o ${{ matrix.out }} .
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
      - name: smoke test
        if: matrix.smoke
        shell: bash
        run: |
          BIN="./${{ matrix.out }}"
          "$BIN" -c 'echo SMOKE; seq 1 3 | tac; printf "xy\n" | od -An -tx1'
          J2="${RUNNER_TEMP:-/tmp}/j2"
          J2="${J2//\\//}"
          printf '1 x\n2 y\n' > "$J2"
          "$BIN" -c "printf \"1 a\\n2 b\\n\" | join - $J2"
          "$BIN" -c 'printf "a\n\nb\n" | nl -ba; printf "abcdefghij\n" | fold -w4'
          test "$("$BIN" --version)" = "unish ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.out }}
          path: ${{ matrix.out }}
          if-no-files-found: error

  # Functional parity on the release build: the differential suite runs
  # against a real GNU reference (Linux, Homebrew GNU on macOS) and Git
  # Bash (Windows), so a release can't ship a behavior regression. On
  # macOS the system bash is 3.2 over BSD tools, which would make the
  # oracle the outlier, so the job installs GNU tools + bash first.
  parity:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            oracle: /bin/bash
          - os: windows-latest
            oracle: "C:/Program Files/Git/bin/bash.exe@C:/Program Files/Git/usr/bin"
          - os: macos-latest
            oracle: /bin/bash
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: GNU reference tools for the oracle (macOS ships BSD + bash 3.2)
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          brew install bash coreutils gnu-sed findutils grep gawk gnu-tar
          P="$(brew --prefix)"
          GNUPATH="$P/opt/coreutils/libexec/gnubin:$P/opt/gnu-sed/libexec/gnubin:$P/opt/findutils/libexec/gnubin:$P/opt/grep/libexec/gnubin:$P/opt/gawk/libexec/gnubin:$P/opt/gnu-tar/libexec/gnubin"
          echo "ORACLE_PATH=$GNUPATH" >> "$GITHUB_ENV"
          echo "ORACLE_SHELL=$P/bin/bash" >> "$GITHUB_ENV"
          echo "$GNUPATH" | tr ':' '\n' >> "$GITHUB_PATH"
          for t in sort sed grep find tar xargs od uniq tr cut wc date; do
            PATH="$GNUPATH:$PATH" "$t" --version 2>/dev/null | head -1 | grep -q GNU \
              || { echo "!! $t is not a GNU tool"; exit 1; }
          done
      - name: build
        run: go build -trimpath -ldflags="-s -w -X main.version=${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}" -o unish${{ matrix.os == 'windows-latest' && '.exe' || '' }} .
      - name: parity suite
        shell: bash
        run: |
          export ORACLE_PATH="${ORACLE_PATH:-${{ startsWith(matrix.os, 'windows') && 'C:/Program Files/Git/usr/bin' || '/usr/bin' }}}"
          ORACLE="${ORACLE_SHELL:-${{ matrix.oracle }}}"
          python parity/runner.py --unish ./unish${{ matrix.os == 'windows-latest' && '.exe' || '' }} --oracle "$ORACLE"

  release:
    needs: [build, parity]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
