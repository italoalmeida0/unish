name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1" # weekly drift watch

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -count=1 ./...
      - name: build
        run: go build -trimpath -ldflags="-s -w" -o unish${{ matrix.os == 'windows-latest' && '.exe' || '' }} .

  # Differential parity: every embedded tool and shell semantic must
  # match GNU bash + coreutils bit for bit. The Linux runner ships them,
  # so /bin/bash is the oracle.
  parity:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: build
        run: go build -trimpath -ldflags="-s -w" -o unish .
      - name: parity suite (vs GNU bash)
        run: python3 parity/runner.py --unish ./unish --oracle /bin/bash
