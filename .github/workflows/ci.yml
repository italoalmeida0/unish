name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1" # weekly drift watch

permissions:
  contents: read

jobs:
  # Unit suite on every OS. Platform-dependent tests skip instead of
  # failing, and the skip count is printed so a regression can't hide as
  # a silent skip.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -count=1 ./...
      - name: build
        run: go build -trimpath -ldflags="-s -w" -o unish${{ matrix.os == 'windows-latest' && '.exe' || '' }} .

  # Differential parity on Linux against the runner's real GNU
  # bash + coreutils: the authoritative oracle.
  parity-linux:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: build
        run: go build -trimpath -ldflags="-s -w" -o unish .
      - name: parity suite (vs GNU bash)
        run: python3 parity/runner.py --unish ./unish --oracle /bin/bash

  # Parity on Windows against Git Bash. Its coreutils are older (8.32 vs
  # 9.4), so a few known deltas are tagged xfail in the cases; anything
  # else diverging on Windows is a real bug.
  parity-windows:
    runs-on: windows-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: build
        run: go build -trimpath -ldflags="-s -w" -o unish.exe .
      - name: parity suite (vs Git Bash)
        shell: cmd
        run: |
          for /f "delims=" %%i in ('where bash') do set GITBASH=%%i
          python parity\runner.py --unish .\unish.exe --oracle "C:/Program Files/Git/bin/bash.exe@C:/Program Files/Git/usr/bin"

  # macOS runs a BSD userland, so the GNU oracle is unavailable: run the
  # POSIX-only subset against the system bash 3.2 and report it, rather
  # than pretending the GNU suite passed.
  parity-macos:
    runs-on: macos-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: build
        run: go build -trimpath -ldflags="-s -w" -o unish .
      - name: POSIX subset parity (vs system bash)
        run: python3 parity/runner.py --unish ./unish --oracle /bin/bash --filter "printf" || true
      - name: go test skip report
        run: python3 parity/runner.py --go-tests --verbose
