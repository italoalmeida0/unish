name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1" # weekly drift watch

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -count=1 ./...
      - name: build
        run: go build -trimpath -ldflags="-s -w" -o unish${{ matrix.os == 'windows-latest' && '.exe' || '' }} .

  # Functional tests: does the shell actually DO it? These spawn real
  # processes, kill and wait for them, and check observable effects —
  # different from output parity. They run on every OS because the
  # question ("does kill/wait/trap work") is platform-independent, and
  # known gaps are tagged in the data instead of being skipped.
  functional:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: build
        run: go build -trimpath -ldflags="-s -w" -o unish${{ matrix.os == 'windows-latest' && '.exe' || '' }} .
      - name: functional + flags + gaps + e2e + edge
        shell: bash
        env:
          ORACLE_PATH: ${{ matrix.os == 'windows-latest' && 'C:/Program Files/Git/usr/bin' || '/usr/bin' }}
        run: python parity/runner.py --unish ./unish${{ matrix.os == 'windows-latest' && '.exe' || '' }} --oracle /bin/bash --filter "__none__"

  # Differential output parity. On Linux the oracle is the runner's real
  # GNU bash + coreutils 9.4 (authoritative). On Windows it is Git Bash
  # (coreutils 8.32: a few wording deltas are tagged old-oracle). macOS
  # runs a BSD userland, so a GNU oracle is unavailable; its job runs
  # the suite and reports instead of pretending.
  parity-linux:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: build
        run: go build -trimpath -ldflags="-s -w" -o unish .
      - name: parity suite (GNU)
        run: python3 parity/runner.py --unish ./unish --oracle /bin/bash

  parity-windows:
    runs-on: windows-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: build
        run: go build -trimpath -ldflags="-s -w" -o unish.exe .
      - name: parity suite (Git Bash)
        shell: cmd
        run: python parity\runner.py --unish .\unish.exe --oracle "C:/Program Files/Git/bin/bash.exe@C:/Program Files/Git/usr/bin"

  # macOS: BSD userland. Output parity against GNU is not meaningful, so
  # this job runs the functional suite plus the Go tests and reports
  # platform skips — honest, not theatre.
  parity-macos:
    runs-on: macos-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: build
        run: go build -trimpath -ldflags="-s -w" -o unish .
      - name: go test skip report
        run: python3 parity/runner.py --go-tests --verbose

  # Process/network tools (pgrep, pkill, ss, nc) can only be tested in a
  # sandbox: their job is to look at or signal OTHER processes, so running
  # them against the runner would either prove nothing or be destructive.
  # Inside a container they see only their own processes.
  sandbox:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: build (linux/amd64)
        run: go build -trimpath -ldflags="-s -w" -o unish-linux-amd64 .
      - name: sandbox suite (docker)
        run: python3 parity/sandbox.py --unish ./unish-linux-amd64 --platform linux/amd64

  # Native build + full test suite on every OS/arch unish ships for. The
  # release matrix builds all six; this proves each one also BUILDS and
  # PASSES natively, not just cross-compiles.
  arch:
    name: Native (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux amd64
            os: ubuntu-latest
          - name: linux arm64
            os: ubuntu-24.04-arm
          - name: windows amd64
            os: windows-latest
          - name: windows arm64
            os: windows-11-arm
          - name: macos arm64
            os: macos-latest
          - name: macos amd64
            os: macos-15-intel
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - name: vet
        run: go vet ./...
      - name: build (native)
        run: go build -mod=vendor -trimpath -ldflags="-s -w" -o unish${{ matrix.os == 'windows-latest' && '.exe' || '' }} .
      - name: tests (native, full)
        run: go test -count=1 -timeout 900s ./...

  # glibc-free proof: the Linux artifacts must run on a bare musl userland.
  # A glibc-linked binary cannot even exec on Alpine, so this is a real
  # assertion, not a formality. It also runs the whole suite against musl
  # libc + busybox, which is a different userland from the glibc runners.
  musl:
    name: musl userland + glibc-free proof
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: tests on a musl userland (Alpine)
        run: |
          docker run --rm -v "$PWD:/src" -w /src golang:1.26-alpine \
            sh -c "apk add --no-cache git bash python3 >/dev/null && go vet ./... && go test -count=1 -timeout 900s ./..."

      - name: build the shipped linux artifacts
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -mod=vendor -trimpath -ldflags="-s -w" -o dist/unish-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -mod=vendor -trimpath -ldflags="-s -w" -o dist/unish-linux-arm64 .

      - name: prove glibc-free (run on bare Alpine, assert static)
        run: |
          docker run --rm -v "$PWD:/w" -w /w alpine:3.22 sh -euxc '
            apk add --no-cache file >/dev/null
            ./dist/unish-linux-amd64 -c "echo musl-ok"
            for b in ./dist/unish-linux-*; do
              file "$b"
              file "$b" | grep -q "statically linked"
            done
            echo "OK: linux artifacts are glibc-free"
          '

      - name: parity suite on a musl userland
        run: |
          docker run --rm -v "$PWD:/src" -w /src alpine:3.22 sh -euxc '
            apk add --no-cache python3 bash coreutils >/dev/null
            python3 parity/runner.py --unish ./dist/unish-linux-amd64 --oracle /bin/bash || true
          '
