name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1" # weekly drift watch

permissions:
  contents: read

jobs:
  # Native vet + full Go test suite + build on EVERY target unish ships
  # for. The release matrix cross-compiles them; this proves each one
  # builds and passes on its own hardware.
  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux amd64
            os: ubuntu-latest
          - name: linux arm64
            os: ubuntu-24.04-arm
          - name: windows amd64
            os: windows-latest
          - name: windows arm64
            os: windows-11-arm
          - name: macos arm64
            os: macos-latest
          - name: macos amd64
            os: macos-15-intel
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - name: vet
        run: go vet ./...
      - name: tests (native, full)
        run: go test -count=1 -timeout 900s ./...
      - name: build (native)
        run: go build -mod=vendor -trimpath -ldflags="-s -w" -o unish${{ startsWith(matrix.os, 'windows') && '.exe' || '' }} .

  # The whole behavioural suite (differential parity + functional, flags,
  # gaps, e2e, edge, cmd, builtins) on EVERY native target unish ships for.
  # The differential groups compare unish against a GNU reference, so the
  # oracle has to be GNU everywhere: bash + coreutils on Linux, Git Bash on
  # Windows, Homebrew's GNU tools + bash on macOS (the system there is bash
  # 3.2 over a BSD userland, which would make the ORACLE the thing that
  # differs -- unish targets GNU).
  suite:
    name: Suite (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux amd64
            os: ubuntu-latest
            oracle: /bin/bash
            exe: ""
          - name: linux arm64
            os: ubuntu-24.04-arm
            oracle: /bin/bash
            exe: ""
          - name: windows amd64
            os: windows-latest
            oracle: "C:/Program Files/Git/bin/bash.exe@C:/Program Files/Git/usr/bin"
            exe: ".exe"
          - name: windows arm64
            os: windows-11-arm
            oracle: "C:/Program Files/Git/bin/bash.exe@C:/Program Files/Git/usr/bin"
            exe: ".exe"
          - name: macos arm64
            os: macos-latest
            oracle: /bin/bash
            exe: ""
          - name: macos amd64
            os: macos-15-intel
            oracle: /bin/bash
            exe: ""
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: GNU reference tools for the oracle (macOS ships BSD + bash 3.2)
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          brew install bash coreutils gnu-sed findutils grep gawk gnu-tar
          P="$(brew --prefix)"
          GNUPATH="$P/opt/coreutils/libexec/gnubin:$P/opt/gnu-sed/libexec/gnubin:$P/opt/findutils/libexec/gnubin:$P/opt/grep/libexec/gnubin:$P/opt/gawk/libexec/gnubin:$P/opt/gnu-tar/libexec/gnubin"
          echo "ORACLE_PATH=$GNUPATH" >> "$GITHUB_ENV"
          echo "ORACLE_SHELL=$P/bin/bash" >> "$GITHUB_ENV"
          echo "$GNUPATH" | tr ':' '\n' >> "$GITHUB_PATH"
          for t in sort sed grep find tar xargs od uniq tr cut wc date; do
            PATH="$GNUPATH:$PATH" "$t" --version 2>/dev/null | head -1 | grep -q GNU \
              || { echo "!! $t is not a GNU tool"; exit 1; }
          done
      - name: build
        run: go build -mod=vendor -trimpath -ldflags="-s -w" -o unish${{ matrix.exe }} .
      - name: behaviour suite
        shell: bash
        run: |
          export ORACLE_PATH="${ORACLE_PATH:-${{ startsWith(matrix.os, 'windows') && 'C:/Program Files/Git/usr/bin' || '/usr/bin' }}}"
          ORACLE="${ORACLE_SHELL:-${{ matrix.oracle }}}"
          python parity/runner.py --unish ./unish${{ matrix.exe }} --oracle "$ORACLE"

  # Process/network tools (pgrep, pkill, ss, nc) can only be tested in a
  # sandbox: their job is to look at or signal OTHER processes, so running
  # them against the runner would either prove nothing or be destructive.
  # Inside a container they see only their own processes.
  sandbox:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: build (linux/amd64)
        run: go build -trimpath -ldflags="-s -w" -o unish-linux-amd64 .
      - name: sandbox suite (docker)
        run: python3 parity/sandbox.py --unish ./unish-linux-amd64 --platform linux/amd64

  # glibc-free proof: the Linux artifacts must run on a bare musl userland.
  # A glibc-linked binary cannot even exec on Alpine, so this is a real
  # assertion, not a formality. It also runs the whole suite on musl libc,
  # a different base from the glibc runners. The differential groups need
  # a GNU reference (unish targets GNU -- busybox output differs by design,
  # and "works" matters more than "prints the same as busybox"), so the
  # Alpine container installs GNU coreutils/findutils/sed/grep/tar and the
  # run asserts they really are GNU before comparing anything.
  musl:
    name: musl userland + glibc-free proof
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: tests on a musl userland (Alpine)
        run: |
          docker run --rm -v "$PWD:/src" -w /src golang:1.26-alpine \
            sh -c "apk add --no-cache git bash python3 >/dev/null && go vet ./... && go test -count=1 -timeout 900s ./..."

      - name: build the shipped linux artifacts
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -mod=vendor -trimpath -ldflags="-s -w" -o dist/unish-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -mod=vendor -trimpath -ldflags="-s -w" -o dist/unish-linux-arm64 .

      - name: prove glibc-free (run on bare Alpine, assert static)
        run: |
          docker run --rm -v "$PWD:/w" -w /w alpine:3.22 sh -euxc '
            apk add --no-cache file >/dev/null
            ./dist/unish-linux-amd64 -c "echo musl-ok"
            for b in ./dist/unish-linux-*; do
              file "$b"
              file "$b" | grep -q "statically linked"
            done
            echo "OK: linux artifacts are glibc-free"
          '

      - name: parity suite on a musl userland
        run: |
          docker run --rm -v "$PWD:/src" -w /src alpine:3.22 sh -euxc '
            apk add --no-cache python3 bash coreutils findutils grep sed tar >/dev/null
            for t in sort sed grep find tar xargs od uniq tr cut wc date; do
              "$t" --version 2>/dev/null | head -1 | grep -q GNU || { echo "!! $t is not a GNU tool"; exit 1; }
            done
            python3 parity/runner.py --unish ./dist/unish-linux-amd64 --oracle /bin/bash
          '
